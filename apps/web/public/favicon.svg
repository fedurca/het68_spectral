<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#05080a"/>
  <!-- The six microphones of the cube, drawn as an octahedron seen corner on. -->
  <g stroke="#2dd4a7" stroke-width="2" fill="none" opacity="0.55">
    <path d="M32 8 L54 32 L32 56 L10 32 Z"/>
    <path d="M32 8 L32 56 M10 32 L54 32"/>
  </g>
  <g fill="#2dd4a7">
    <circle cx="32" cy="8" r="4"/>
    <circle cx="32" cy="56" r="4"/>
    <circle cx="10" cy="32" r="4"/>
    <circle cx="54" cy="32" r="4"/>
  </g>
  <g fill="#7dd3fc">
    <circle cx="20" cy="20" r="3.5"/>
    <circle cx="44" cy="44" r="3.5"/>
  </g>
</svg>
