name: build and deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      attach_snap_tag:
        description: >-
          Build the Ubuntu snap and attach it to an existing GitHub Release
          (e.g. v2.0.6). Leave empty on ordinary runs.
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.attach_snap_tag || 'none' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build-info stamps the commit, and a shallow clone still knows it, but the
          # branch name and dirty check need the real repository.
          fetch-depth: 0

      # Version comes from package.json "packageManager"; pinning it here as well makes
      # pnpm/action-setup refuse to run with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The DSP is C compiled to WebAssembly, and the same sources build for the
      # firmware's second core. Both are compiled here so a change that breaks one is
      # caught before it is deployed.
      # Pinned to a commit rather than a tag. A tag is mutable, and this action runs
      # with access to the checkout before the deploy job ever sees a secret.
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 4.0.19
          actions-cache-folder: emsdk-cache
          # Bump the key when the cache action / folder layout changes so a stale
          # Node-20-era entry cannot 400 the restore path.
          cache-key: emsdk-4.0.19-v16-${{ runner.os }}-${{ runner.arch }}

      - name: Build the DSP core to WebAssembly
        run: pnpm run build:dsp

      - name: Native DSP tests
        run: pnpm run test:dsp

      # The same vectors through the WebAssembly build. Native passing and WebAssembly
      # failing is exactly the drift the shared C sources exist to prevent.
      - name: WebAssembly DSP smoke test
        run: pnpm run test:wasm

      - name: TypeScript tests
        # Scoped by vitest.config.ts to packages/**/*.test.ts so the Emscripten
        # SDK cache under emsdk-cache/ is never loaded as part of the suite.
        run: pnpm run test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Worker syntax
        run: pnpm run check

      - name: Stamp build info
        run: pnpm run build:info

      - name: Build the web application
        run: pnpm --filter @het68/web run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

      # The WebAssembly artifact is not committed, so the deploy job would otherwise
      # have to rebuild it with the whole Emscripten toolchain.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsp-wasm
          path: packages/dsp-core/wasm
          retention-days: 7

  deploy:
    needs: build
    # The repository check keeps the Cloudflare token out of forks: a pull request from
    # a fork cannot reach it anyway, but a fork pushing to its own main would otherwise
    # try, fail confusingly, and put the account id in a public log.
    if: >-
      github.repository == 'fedurca/het68_spectral' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: apps/web/dist

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # wrangler-action runs `npm i` in this pnpm workspace and npm 11 crashes
          # (Cannot read properties of null (reading 'edgesOut')). Install beside it.
          npm install --prefix /tmp/wrangler-cli wrangler@4.119.0
          /tmp/wrangler-cli/node_modules/.bin/wrangler deploy

  desktop:
    # Only for tagged releases: a dmg on every push to main would be noise, and the
    # runner minutes are not free.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: apps/web/dist

      - name: Build the dmg
        # No Apple Developer identity in CI yet. electron-builder ships with
        # identity:null; afterPack.cjs applies an ad-hoc codesign so Gatekeeper
        # does not report a "damaged" app. Users still need to clear quarantine
        # on first launch (xattr -cr …) until notarization exists.
        run: pnpm --filter @het68/desktop exec electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: het68-spectral-macos
          path: apps/desktop/release/*.dmg
          retention-days: 30

      # Same pattern as het68 firmware: tagged SemVer release gets downloadable
      # assets plus notes pointing at CHANGELOG.md. The Ubuntu snap is attached by
      # the separate `snap` job so a snapcraft failure cannot block the dmg.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: apps/desktop/release/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/fedurca/het68_spectral/blob/${{ github.ref_name }}/CHANGELOG.md) for the curated release notes.

            ### macOS
            The `.dmg` is **not notarized**. After install, clear quarantine once:

            ```bash
            xattr -cr "/Applications/het68 spectral.app"
            open "/Applications/het68 spectral.app"
            ```

            ### Ubuntu / Linux
            When a `.snap` is attached to this release:

            ```bash
            sudo snap install --dangerous ./het68-spectral_*.snap
            sudo snap connect het68-spectral:audio-record
            sudo snap connect het68-spectral:serial-port
            sudo snap connect het68-spectral:alsa
            ```

            `--dangerous` is required until the snap is published on the Snap Store.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snap:
    # Own job so snapcraft 9 / runner issues cannot soft-fail away unnoticed while
    # still leaving the macOS dmg release intact. Can also backfill an existing
    # release via workflow_dispatch input attach_snap_tag.
    needs: build
    if: >-
      github.repository == 'fedurca/het68_spectral' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.attach_snap_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: apps/web/dist

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.attach_snap_tag }}" ]; then
            echo "tag=${{ inputs.attach_snap_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install snapcraft
        timeout-minutes: 5
        run: |
          sudo snap install snapcraft --classic
          snapcraft --version
          # Snapcraft 9.1 looks for the desktop file in snap/meta/gui before it
          # copies snap/gui there. electron-builder only writes snap/gui.
          python3 -c 'import os; from pathlib import Path; p=Path(os.environ["HOME"])/"bin"/"snapcraft"; p.parent.mkdir(parents=True, exist_ok=True); p.write_text("#!/bin/sh\nif [ -d snap/gui ]; then\n  mkdir -p snap/meta/gui\n  cp -a snap/gui/. snap/meta/gui/\nfi\nexec /snap/bin/snapcraft \"$@\"\n"); p.chmod(0o755)'
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build the snap
        timeout-minutes: 45
        run: |
          # Runner images keep apt lists that still name libxml2 revisions Ubuntu
          # has deleted. Snapcraft will not refresh them itself unless it is root.
          sudo apt-get update
          rm -rf "${HOME}/.cache/snapcraft"
          pnpm --filter @het68/desktop exec electron-builder --linux snap --publish never
        env:
          SNAPCRAFT_BUILD_ENVIRONMENT: host

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: het68-spectral-snap
          path: apps/desktop/release/*.snap
          retention-days: 30

      - name: Attach snap to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la apps/desktop/release/*.snap
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet; creating a draft shell for the snap."
            gh release create "$TAG" --title "$TAG" --notes "See CHANGELOG.md" --latest=false
          fi
          gh release upload "$TAG" apps/desktop/release/*.snap --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
